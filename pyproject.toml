[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-pbr-mcp"
version = "0.1.0"
description = "FastMCP server wrapping ComfyUI API workflows to generate PBR texture maps from a base color image."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "JakeBilu" }]
keywords = ["comfyui", "pbr", "textures", "mcp", "3d", "rendering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "mcp>=1.0.0",
  "requests>=2.31.0",
  "websocket-client>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/JakeBilu/comfyui-pbr-mcp"
Repository = "https://github.com/JakeBilu/comfyui-pbr-mcp"

[project.scripts]
comfyui-pbr-mcp = "comfyui_pbr_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comfyui_pbr_mcp = ["workflows/*.json"]
